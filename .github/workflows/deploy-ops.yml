name: Deploy through Ops

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: platform-ffb8f879-7546-4ce5-af9c-d6c52f32f582-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Queue the immutable commit with a short-lived GitHub identity
        shell: bash
        env:
          PLATFORM_AUDIENCE: https://ops.m12n.org/deploy
          PLATFORM_URL: https://ops.m12n.org
          PLATFORM_WORKLOAD_ID: ffb8f879-7546-4ce5-af9c-d6c52f32f582
        run: |
          set -Eeuo pipefail
          request_headers="$(mktemp)"
          deploy_headers="$(mktemp)"
          deploy_payload="$(mktemp)"
          trap 'rm -f "$request_headers" "$deploy_headers" "$deploy_payload"' EXIT
          chmod 600 "$request_headers" "$deploy_headers" "$deploy_payload"
          printf 'Authorization: bearer %s\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" > "$request_headers"
          token_response="$(curl --fail --silent --show-error \
            --header "@$request_headers" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${PLATFORM_AUDIENCE}")"
          oidc_token="$(jq -er '.value' <<<"$token_response")"
          printf 'Authorization: Bearer %s\nContent-Type: application/json\n' \
            "$oidc_token" > "$deploy_headers"
          jq -nc --arg workload_id "$PLATFORM_WORKLOAD_ID" \
            '{workload_id:$workload_id}' > "$deploy_payload"
          curl --fail --silent --show-error \
            --header "@$deploy_headers" \
            --data-binary "@$deploy_payload" \
            "$PLATFORM_URL/api/v1/deployments"
